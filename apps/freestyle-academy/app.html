<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Freestyle Academy — Entrena tu mente. Domina las palabras.</title>
  <meta name="description" content="El dojo digital del rap improvisado. Entrena freestyle en español con rondas de palabras, temáticas, imágenes y objetos, batalla en este dispositivo y mide tu progreso en la Freestyle League.">
  <meta name="theme-color" content="#080A12">
  <meta name="color-scheme" content="dark light">

  <meta property="og:title" content="Freestyle Academy">
  <meta property="og:description" content="Entrena tu mente. Domina las palabras. El entrenamiento de freestyle en español.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="LITrenders">
  <meta property="og:locale" content="es_ES">

  <link rel="canonical" href="https://litrenders.com/apps/freestyle-academy/app.html">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23080A12'/%3E%3Cpath d='M6 24V9h14M6 16.5h11' stroke='%237B35FF' stroke-width='3.2' stroke-linecap='round' fill='none'/%3E%3Ccircle cx='24' cy='22' r='3' fill='%2323D7F2'/%3E%3C/svg%3E">

  <!-- Brand typography: Bebas Neue (headers) + Satoshi (body).
       Both are free; Satoshi is served by Fontshare, not Google Fonts.
       If either fails to load the CSS falls back to a close system stack. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">

  <style>
    /* Way back out of the fullscreen app, to its page on litrenders.com.
       Shown only on the five top-level routes, where no .topbar is rendered
       and nothing else occupies the lower-left corner. It removes itself when
       the app is running inside the info page's own iframe, where it would
       only reload the page underneath. */
    .site-back {
      position: fixed;
      left: 12px;
      bottom: calc(var(--nav-h, 76px) + env(safe-area-inset-bottom, 0px) + 12px);
      z-index: 45;
      display: none;
      align-items: center;
      gap: 7px;
      padding: 7px 13px 7px 10px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background: color-mix(in srgb, var(--surface-high) 88%, transparent);
      backdrop-filter: blur(14px);
      color: var(--text-secondary);
      font: 600 12px/1 var(--font);
      letter-spacing: .02em;
      text-decoration: none;
    }
    .site-back[data-visible] { display: inline-flex; }
    .site-back:hover, .site-back:focus-visible { color: var(--text-primary); }
    .site-back svg { width: 14px; height: 14px; flex: none; }
  </style>
</head>
<body>
  <a class="sr-only" href="#view">Saltar al contenido</a>
  <div id="app"></div>

  <a class="site-back" id="siteBack" href="./" target="_top" aria-label="Volver a Freestyle Academy en litrenders.com">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="9"></circle><path d="M12 11v5"></path><path d="M12 7.6v.4"></path>
    </svg>
    Sobre la app
  </a>

  <noscript>
    <div style="padding:32px 20px;max-width:560px;margin:0 auto;text-align:center">
      <h1 style="font-family:sans-serif">Freestyle Academy</h1>
      <p style="font-family:sans-serif;line-height:1.6;color:#B7B9C7">
        Esta aplicación necesita JavaScript para funcionar. Actívalo en tu
        navegador para entrenar.
      </p>
    </div>
  </noscript>

  <script>
    /* Keeps the "Sobre la app" link to the top-level routes, and drops it
       entirely inside the info page's iframe. No app module is touched. */
    (function () {
      var link = document.getElementById('siteBack');
      if (window.self !== window.top) { link.remove(); return; }
      var TOP_LEVEL = ['studio', 'battles', 'train', 'progress', 'profile'];
      function sync() {
        var route = window.location.hash.replace(/^#\/?/, '').split('?')[0];
        if (!route) route = 'train';
        if (TOP_LEVEL.indexOf(route) >= 0) link.setAttribute('data-visible', '');
        else link.removeAttribute('data-visible');
      }
      window.addEventListener('hashchange', sync);
      sync();
    })();
  </script>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
